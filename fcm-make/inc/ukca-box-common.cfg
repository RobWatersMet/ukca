#SAN - changing name of executable
$UKCA_EXEC{?} = ukca-box.exe

# CPP defaults:
$portio_version{?} = 2A  # C95
$mpp_version{?}    = 1C  # C96
$timer_version{?}  = 3A  # C97
$land_surface_model{?} = jules # land surface model
$ls_precipitation_precision{?} = double
$recon_mpi{?} = parallel # Parallel/serial reconfiguration
# Dr Hook defined in platform-specific configs or not used.

# Include parallel config currently - will need to test with serial/selectable option
include = parallel.cfg

# Set app-dependent CPP defs:
$keys_ukca_app{?} = $cppflags_portio $cppflags_mpp $cppflags_timer $cppflags_land_surface $cppflags_ls_precip $cppflags_drhook $cppflags_mkl $cppflags_netcdf $cppflags_thread_utils

# Set defaults for additional CPP defs:
$keys_platform_extra{?} =
$keys_ukca_extra{?} =

# Gather Fortran compiler flags:
$fcflags_overrides{?} =
$fcflags_all = $fcflags_common $fcflags_level $fcflags_options \
             \ $fcflags_overrides

# Exclusions for additional external modules:
$external_modules{?} =
$nodep_f_module = $nodep_options $external_modules

# Exclusions for additional external includes:
$external_includes{?} =
$nodep_include = $nodep_include_options $external_includes

# Preprocess and build declarations
$fpp{?} = cpp
$fppflags{?} = -C -P -traditional
$fppflags_options{?} =
preprocess.prop{class,cpp} = $cpp
preprocess.prop{class,cpp.flags} = $cppflags
preprocess.prop{class,fpp} = $fpp
preprocess.prop{class,fpp.flags} = $fppflags $fppflags_options

build.prop{class,cc} = $cc
build.prop{class,fc} = $fc
build.prop{class,cc.flags} = $ccflags
build.prop{class,fc.flags} = $fcflags_all

$keys_ukca{?} = $keys_platform $keys_platform_extra \
                $keys_ukca_app $keys_ukca_extra
preprocess-box.prop{no-step-source} = 
preprocess-box.prop{cpp.defs,fpp.defs} = $keys_ukca
preprocess-box.ns-excl = 

build-box.prop{no-step-source} = 
build-box.target        = ukca-box ukca_script_functions $UKCA_EXEC
build-box.target-rename = ukca_main.exe:$UKCA_EXEC
build-box.prop{no-dep.f.module} = mpl gcom_mod gc_kinds_mod gc__buildconst \
  \ $nodep_f_module
build-box.prop{no-dep.include} = $nodep_include
build-box.ns-excl = 
build-box.prop{fc.flags-ld} = $ldflags $ldflags_coupling

