sort-key=1
type=real

[namelist:run_convection=betts_tau]
compulsory=true
description=Relaxation time in seconds.
help=Free parameter for Simple Betts-Miller convection.
    =This variable is used in calculting the temperature and moisture relaxation
    =profiles. These profiles are used by the convection scheme the determine
    =how much rain to produce.
ns=namelist/unused
