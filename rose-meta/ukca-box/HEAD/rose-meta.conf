[namelist:run_convection=termconv]
compulsory=true
description=Termination condition method for convection
fail-if=this == 2 and (namelist:run_convection=i_convection_vn != 6);
       =#term_conv=2 is only available for the 6a convection.
help=Method used for the parcel termination condition for convection
    =5a scheme. Options 0 and 1 only
    =0: terminates if approaching the top of the model or there is
    =forced detrainment and (mass flux is small or the buoyancy exceeds
    =that of an undilute parcel). Not recommended as the estimate of
    =undilute parcel buoyancy is not very accurate.
    =1: simplified termination condition. Terminates if approaching the
    =top of the model or the mass flux is small.
    =6a scheme. Options 0,1,2 (but 0 and 1 are identical).
    =0,1: terminates if approaching the top of model or if the mass flux
    =falls below a small fraction of the cloud base mass flux or if the
    =forced detrainment rate is large.
    =2: as 0,1 but will also terminate if the buoyancy of an undilute
    =parcel becomes negative at this level.
ns=namelist/unused
sort-key=5d-up-a-02
values=0,1,2

[namelist:run_convection=thpixs_mid]
