[namelist:temp_fixes]
compulsory=true
description=to assist managing science fixes across UKCA versions and configurations
ns=namelist/UKCA Box-Model Science Settings/temp_fixes
title=Short term logicals

[namelist:temp_fixes=l_fix_drydep_so2_water]
compulsory=true
description=Use correct surface resistance of water when calculating the dry deposition of SO2
help=When calculating the dry deposition of SO2, the surface resistance of
    =water was wrongly set to 148.9 s/m. This is used in UKESM1.0, and so
    =needs to be maintained. Setting this logical to true, will set the
    =surface resistance of water for the dry deposition of SO2 to 10 s/m
    =instead.
type=logical

[namelist:temp_fixes=l_fix_improve_drydep]
compulsory=true
description=Fix dry deposition velocities
help=Non zero dry deposition velocities are set for HCl, HOCl, HBr, HOBr,
    = H2SO4, MeOH and Sec_Org.
    =
    = Dry deposition velocities for 9 tiles are made consistant with those of
    = 13 / 17 / 27 tiles.
type=logical

[namelist:temp_fixes=l_fix_nacl_density]
compulsory=true
description=Correction to the UKCA sea-salt density
help=When set to true,
    =the sea-salt density is increased from
    =1600 to 2165 kg per cubic metre
    = It is a short term logical until the code becomes the new default.
    = Note that this will change results when selected.
type=logical

[namelist:temp_fixes=l_fix_pc2_cnv_mix_phase]
compulsory=true
description=Corrects the conservation of water in PC2's ice-liquid repartition
help=If set to true this switch fixes a bug that can lead to non-conservation
    =of water in PC2's repartition of ice and liquid cloud condensate within
    =the 6a convection scheme.
ns=namelist/unused
type=logical

[namelist:temp_fixes=l_fix_ukca_activate_pdf]
compulsory=true
description=When true, ensures the range of updraft speeds that are integrated
           =over moves with the mean updraft
type=logical

[namelist:temp_fixes=l_fix_ukca_activate_vert_rep]
compulsory=true
description=Fix CDNC vertical replication in cloud columns (ACTIVATE scheme)
help=When set to true, this corrects a bug in the vertical replication
    = of the cloud drop number concentrations in a contiguous vertical
    = column of cloud for the ukca_activate subroutine. Currently the
    = number per cm^-3 is replicated, whereas it should be the number
    = per kg of air since this is more physically representative of
    = of rising parcel of air.
    = It is a short term logical until the code becomes the new default.
type=logical

[namelist:temp_fixes=l_fix_ukca_cloud_frac]
compulsory=true
description=Fix offset in indexing of cloud fraction array
help=When set to true, this corrects a bug in the indexing of the cloud
    = fraction array used in aerosol chemistry that causes values from the
    = level below the correct level to be used.
    = Has no effect in configurations that do not include aerosol chemistry.
    = It is a short term logical until the code becomes the new default.
type=logical

[namelist:temp_fixes=l_fix_ukca_h2dd_x]
compulsory=true
description=Fix for UKCA deposition of H2.
help=When set to true, this corrects a bug in the element of
    = h2dd_c and h2dd_m used for the calculation of H2 dry deposition to
    = shrub and bare soil.
type=logical

[namelist:temp_fixes=l_fix_ukca_h2so4_ystore]
compulsory=true
description=Correctly store UKCA H2SO4 tracer
help=When true, correctly store the UKCA H2SO4 tracer in ASAD
    =for updating in GLOMAP-mode. Also correct the products of the
    =SO2+OH reaction in the StratTrop and Strat mechanisms.
type=logical

[namelist:temp_fixes=l_fix_ukca_hygroscopicities]
compulsory=true
description=Correction to calculation of mean aerosol hygroscopicities in ACTIVATE and
           =an update of hygroscopicity values
help=When set to true, a fix is applied to correct an issue with the calculation of
    =the weighted mean hygroscopicity across the different composition types within
    =each aerosol mode. The specified hygroscopicities of some species are also
    =updated to reflect the recent literature - e.g., organic carbon is set to be
    =slightly hygroscopic (previously was zero and so did not activate into droplets)
    =and values for sulphate, sea-salt and nitrate are also updated.
    =It is a short term logical until the code becomes the new default.
    =Note that this will change results when selected if using UKCA mode and
    =Abdul-Razzak Ghan droplet activation.
type=logical

[namelist:temp_fixes=l_fix_ukca_impscav]
compulsory=true
description=Fix for UKCA impaction scavenging.
help=When set to true,
    =this corrects 2 bugs in the UKCA impaction scavenging code,
    =which together cause a small over-estimation of scavenging.
    = It is a short term logical until the code becomes the new default.
type=logical

[namelist:temp_fixes=l_fix_ukca_offox_h2o_fac]
compulsory=true
description=Convert water vapour to vmr in UKCA Offline-Oxidants chemistry
help=When set to False, UKCA will use water vapour in mass-mixing ratio
    = within the Offline-Oxidants chemical mechanism.
    =If set to True, water vapour will be converted to volume mixing
    = ratio.
type=logical

[namelist:temp_fixes=l_fix_ukca_water_content]
compulsory=true
description=Correction to calculation of aerosol water contents in
           =ukca_water_content_v
help=When set to true, a fix is applied to correct issues with the calculation of
    =aerosol water content values.
    =It is a short term logical until the code becomes the new default.
type=logical

[namelist:temp_fixes=l_improve_aero_drydep]
compulsory=true
description=Improve aerosol dry deposition
help=If TRUE a new method of determining the dominant land-surface category
    = and the corresponding roughness lengths from JULES are used in the
    = GLOMAP aerosol (and non-interactive gaseous) dry deposition scheme
    =
    = This also removes dependency of the scheme on number of surface tiles.
type=logical

[namelist:temp_fixes=l_improve_cv_cons]
compulsory=true
description=Improve convection energy correction
help=If true,
    = (i)  uses start of timestep air densities to convert from specific
    =      humidities to mixing ratios in the energy correction part of the
    =      6A convection scheme
    = (ii) uses the actual dry density in the energy integrals instead of an
    =      approximation
    =This then affects global energy correction.
ns=namelist/unused
type=logical

[namelist:temp_fixes=l_fix_arcl_eg_levs]
compulsory=true
description=Fix for EG aerosol climatologies and microphysics
ns=namelist/unused
type=logical

[namelist:temp_fixes=l_methox_fix]
compulsory=true
description=Fix indexing error for level height in methane oxidation scheme
help=When set to false,
    =the idealised pressure profile used within
    = the methane oxidation scheme uses heights from the level below,
    =so that the pressures will be consistently too high.
    = It is a short term logical until the code becomes the new default.
ns=namelist/unused
type=logical

[namelist:tuning_segments]
ns=namelist/unused

[namelist:tuning_segments=a_convect_seg_size]
compulsory=true
description=Segment size for Convection code (non-tracer cycles)
help=Set to negative to activate the choice of the number of segments
    =(see namelist:tuning_segments=a_convect_segments)
    =We recommend an initial value of 16, but please run the automatic segment
    =size tuning to determine the optimal size for your configuration.
ns=namelist/unused
range=-99:-1,1:999
sort-key=2
trigger=namelist:tuning_segments=a_convect_segments: this < 0
type=integer

[namelist:tuning_segments=a_convect_segments]
compulsory=true
description=Number of segments used in Convection code
help=No recommended values
    = Please consider setting the segment size.
ns=namelist/unused
range=-99:-1,1:999
sort-key=4
type=integer

[namelist:tuning_segments=a_convect_trac_seg_size]
compulsory=true
description=Segment size for Convection code (tracer cycles)
help=Set to negative to activate the choice of the number of segments
    =(see namelist:tuning_segments=a_convect_segments)
    =We recommend an initial value of 16, but please run the automatic segment
    =size tuning to determine the optimal size for your configuration.
ns=namelist/unused
range=-99:-1,1:999
sort-key=3
trigger=namelist:tuning_segments=a_convect_segments: this < 0
type=integer

[namelist:tuning_segments=ukca_chem_seg_size]
compulsory=true
description=Segment size sent to the ASAD chemical solver
help=Allows the user to specify number of gridpoints per segment.
    =Cannot be greater than the number of model levels
ns=namelist/UKCA Box-Model Science Settings/Chemistry
range=1:1
sort-key=zz999
type=integer

[namelist:tuning_segments=ukca_mode_seg_size]
compulsory=true
description=Number of columns of atmosphere per segment sent to aerosol function
help=Allows the user to specify number of columns in a segment.
    = Chunks are a subset of the atmosphere that are processed by the
    = aerosol sub system. Smaller segment are generally better.
    = Important that the number of segment is a factor of the row_length*rows
    = For example, a model with 12 longitudes and 18 latitudes on an MPI task can use
    = up to 216 columns per segment (that is one segment for whole domain)
    = We recommend an initial value of 4, but please run the automatic segment
    = size tuning to determine the optimal size for your configuration.
ns=namelist/UKCA Box-Model Science Settings/GLOMAP
range=1:1
sort-key=zz999
type=integer

[namelist:tuning_segments=ussp_seg_size]
compulsory=true
description=Segment size for USSP Gravity Wave Drag code
help=We recommend an initial value of 36, but please run the automatic segment
    =size tuning to determine the optimal size for your configuration.
ns=namelist/unused
range=1:999
sort-key=5
type=integer

