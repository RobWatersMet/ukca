    =
    = (6) 6A convection scheme - Includes the mass flux scheme plus turbulent alternatives.
    =  The updraught part of the mass flux scheme has been revised to remove various problems
    = in the 5A version. Users are recommended to consider switching to this scheme.
    = The 6A scheme is used by GA7 physics.
    =
    = Numbers 10 or greater indicate non-standard convection schemes:
    =
    = (10) The Lambert-Lewis convection scheme (LLCS) is a simplified
    =  convection scheme for use in idealised simulations and exoplanet
    =  models. It is not recommended for use except after discussion with
    =  the code owner.
    =
    = (11) The Simple Betts-Miller scheme is an idealised convection scheme written for a water condensate
    =   but could be changed for use in exoplanets with some modifications.
