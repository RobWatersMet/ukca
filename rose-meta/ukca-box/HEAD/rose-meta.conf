    =
    = 2: BC absorption is tuned down by increasing density to 1800 kg/m3
    =    and switching to the Maxwell-Garnet approximation when
    =    incorporating BC into the refractive index calculation.
    =    This option substantially increases the computation cost of
    =    RADAER and of the radiation scheme as a whole so is currently
    =    not recommended except for development and dedicated
    =    aerosol-radiation studies.
ns=namelist/UM Science Settings/section34/Feedbacks
sort-key=f20702
value-titles=No tuning,
            =BC density set to 1900 kg/m3,
            =BC density set to 1800 kg/m3 and Maxwell-Garnet mixing rule
values=0,1,2

