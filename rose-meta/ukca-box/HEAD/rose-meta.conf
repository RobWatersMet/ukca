help=Quadratic averaging of the surface temperature at coastal points.
    =
    =.FALSE. is deprecated.
    =
    =Options for historical treatment of surface emissivity and temperature:
    =
    =Logical          Default  GL4
    =l_t_rad_solid    .F.      .T.
    =l_quad_t_coast   .F.      .T.
    =l_rad_snow_emis  .F.      .T.
    =l_t_land_nosnow  .F.      .F.
ns=namelist/unused
sort-key=lw07
type=logical

[namelist:run_radiation=l_rad_deg]
compulsory=true
