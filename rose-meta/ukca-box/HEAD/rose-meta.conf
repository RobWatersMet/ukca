[namelist:run_convection=l_pc2_diag_sh]
compulsory=true
description=Use diagnostic convective shallow cloud to replace PC2 cloud
help=This option is only possible for the shallow turbulence schemes which
    = have problems producing cloud increments for PC2. Setting this to true
    = replaces the PC2 cloud by the convective diagnosed cloud amount for
    = points where shallow convection occurs. This is an experimental option
    = and is not recommended.
ns=namelist/unused
sort-key=cloud-ccrad-10
type=logical

[namelist:run_convection=l_prog_pert]
compulsory=true
description=Prognostic dependent scaling of mid-level initial parcel perturbation
help=If selected, the mid-level initial parcel perturbation is scaled dependent
    = on the precipitation based convective prognostive and hence requires that
    = l_conv_prog_precip is true. More recent convective
    = activity results in an increase in the initial buoyancy perturbation.
    = The maximum scaling is set via max_pert_scale.
ns=namelist/unused
sort-key=5d-up-mdet-02
trigger=namelist:run_convection=max_pert_scale: .true. ;
type=logical

[namelist:run_convection=l_rediagnosis]
compulsory=true
description=Cumulus rediagnosis option
help=If more than one convection step per model physics timestep then
    =rediagnose cumulus points by recalling conv_diag before each convective
    =sub-step.
ns=namelist/unused
sort-key=5b-06
type=logical

[namelist:run_convection=l_reset_neg_delthvu]
compulsory=true
description=Suppress diagnosing cumulus where buoyancy integral comes out
           = negative.
help=In the 6A convective diagnosis, there is an integral of the parcel
    = virtual potential temperature excess delthvu.  If this switch is true,
    = then diagnosis of a cumulus-capped boundary-layer is reset to false
    = if delthhvu is negative.
ns=namelist/unused
sort-key=5b-08
type=logical

[namelist:run_convection=l_safe_conv]
compulsory=true
description=Switch on various safety checks to improve convection
help=This switch applies to the 5a scheme and is recommended to be switched
    = on. It prevents convection seeing any negative q values. It also
    = removes any failed convective ascents.
ns=namelist/unused
sort-key=5c-main-switch-01
type=logical

[namelist:run_convection=l_snow_rain]
compulsory=true
description=Allows mixed phase convective precipitation in Emanuel
           =downdraught scheme
help=Allows both convective snow and rain to coexist in Emanuel
    =downdraught scheme
ns=namelist/unused
sort-key=5g-dd-03
type=logical

[namelist:run_convection=limit_pert_opt]
compulsory=true
description=Limit initial parcel perturbation option.
help=Limit initial parcel perturbations options.
    = This limits the initial parcel perturbations in temperature and humidity
    = to physically sensible values in both the main ascent and the convection
    = diagnosis.
    =
    = 0 - no limits applied.
    =
    = 1 - apply limits to main ascent only.
    =
    = 2 - apply limits to main ascent and to the convection diagnosis.
ns=namelist/unused
sort-key=5b-06
values=0,1,2

[namelist:run_convection=llcs_cloud_precip]
compulsory=true
description=Clouds vs precipitation option.
help=Free parameter for Lambert-Lewis convection.
    =Determines whether LLCS outputs rain or cloud:
    =
    = "all_rain" - all available moisture is rained out, no cloud condensate is produced
    =
    = "all_cloud" - rain is set to zero, all condensate and cloud fraction is passed to
    =               the cloud scheme (PC2 is recommended)
    =
    = "crit_condens" - rain removes excess of moisture, above a threshold set by critical
    =                  condensate parameters; the rest is passed to the LS cloud scheme
    =
    = "const_frac" - rain fraction is defined by llcs_rain_frac, while the rest is retained
    =                as cloud condensate and passed to the cloud scheme
ns=namelist/unused
sort-key=1
trigger=namelist:run_convection=llcs_detrain_coef: 1,2,3;
       =namelist:run_convection=llcs_rain_frac: 3;
value-titles=all_rain,all_cloud,crit_condens,const_frac
values=0,1,2,3

[namelist:run_convection=llcs_detrain_coef]
compulsory=true
description=Cloud detrainment fraction.
help=Free parameter for Lambert-Lewis convection.
    =Used to emulate detrainment of convective clouds up to a given fraction.
    =This fraction is multiplied by the model timestep and divided by
    =the timescale of convection (llcs_timescale)
    =
    =Example:
    =at N96 resolution the time step is usually 1200 s, so the resulting cloud
    =fraction is 0.6 * 1200 / 3600 = 0.2
ns=namelist/unused
range=0.0:1.0
sort-key=4
type=real

[namelist:run_convection=llcs_rain_frac]
compulsory=true
description=Rain fraction.
help=Free parameter for Lambert-Lewis convection.
    =The fraction of condensed water increment that is rained out
    =in a form of convective rain.
ns=namelist/unused
range=0.0:1.0
sort-key=5
type=real

[namelist:run_convection=llcs_rhcrit]
compulsory=true
description=Critical relative humidity from 0 to 1.
help=Free parameter for Lambert-Lewis convection.
    =Used to determine whether or not to trigger moist convection.
ns=namelist/unused
range=0.0:1.0
sort-key=2
type=real

[namelist:run_convection=llcs_timescale]
compulsory=true
description=Relaxation time in seconds.
help=Free parameter for Lambert-Lewis convection.
    =Used to calculate the temperature and moisture relaxation profiles.
ns=namelist/unused
range=1<this<99999
sort-key=3
type=real

[namelist:run_convection=max_pert_scale]
compulsory=true
description=The max scaling for the initial mid-level parcel perturbation
help=The maximum scaling for the prognostic dependent initial mid-level
    = parcel perturbation. Used for mid-level only with l_prog_pert=T.
ns=namelist/unused
range=1.0:20.0
sort-key=5d-up-mdet-02

[namelist:run_convection=md_pert_opt]
compulsory=true
description=Initial perturbation method for mid-level convection
           =  0: Original option. Fixed buoyancy perturbation
           =     in temperature only
           =  1: The relative size of temperature
           = 	 and humidity perturbations set by specifying the
           =     evaporative fraction at cloud base via efrac
           =  2: The relative size of temperature
           = 	 and humidity perturbations set by specifying the
           =     evaporative fraction at cloud base. In the boundary layer
           =     the cloud base evaporative fraction is set equal to that
           =     of the surface. In the free troposhere it is set via efrac.
           =     Just above the boundary layer top there is a blend between the
           =     two methods.
ns=namelist/unused
range=0:2
sort-key=5d-up-mdet-02
trigger=namelist:run_convection=efrac: 1,2 ;
type=integer

[namelist:run_convection=mdet_opt_dp]
compulsory=true
description=Mixing detrainment profile for deep convection in 6A convection.
           = 0 - original detrainment profile.
           = 1 - relative humidity dependent profile usually used with
           = adaptive detrainment
ns=namelist/unused
range=0:1
sort-key=5d-up-mdet-02
type=integer

[namelist:run_convection=mdet_opt_md]
compulsory=true
description=Mixing detrainment profile for mid-level convection in 6A convection.
           = 0 - original detrainment profile.
           = 1 - relative humidity dependent profile usually used with
           = adaptive detrainment
ns=namelist/unused
range=0:1
sort-key=5d-up-mdet-02
type=integer

[namelist:run_convection=mid_cmt_opt]
compulsory=true
description=Mid convection momentum transport option:
help=0: Gregory-Kershaw scheme (default)
    = 1: Diffusive scheme
    = 2: Numerically stabilized Gregory-Kershaw scheme
ns=namelist/unused
sort-key=cmt-03
values=0,1,2

[namelist:run_convection=mid_cnv_pmin]
compulsory=true
description=Minimum pressure for mid level convection (Pa)
help=Minimum pressure for mid level convection.
    =
    = This sets the minimum pressure in Pa (i.e. maximum height) at which to
    = test for the initiation of mid level convection.
    =
    = The basic assumptions used by the convection
    = scheme will be invalid outside of the troposphere and using this option
    = it is possible to prevent convection occurring at too high a level.
    =
    = Setting the minimum pressure to 0.0 allows mid-level convection to
    = initiate from any height and will replicate the behaviour of earlier
    = versions of the convection scheme. A value of 10000.0 is recommended
    = to prevent mid-level convection initiating outside of the troposphere.
ns=namelist/unused
range=0:1.0e7
sort-key=5c-main-switch-12
type=real

[namelist:run_convection=midtrig_opt]
compulsory=true
description=Mid convection triggering level option:
help=Controls the lowest level from which mid-level convection can trigger.
    = 0: Allow mid-level convection from two levels above ntml or two levels
    =    above shallow or deep termination (original condition)
    = 1: Allow mid-level convection from the level above ntml or the level
    =    above shallow or deep termination
    = 2: Allow mid-level convection from ntml or the level
    =    above shallow or deep termination
    = 3: Allow mid-level convection from the level 1 or the level above
    =    shallow or deep termination
ns=namelist/unused
sort-key=5b-06
values=0,1,2,3

[namelist:run_convection=mparwtr]
compulsory=true
description=Maximum critical cloud condensate
help=Maximum Critical Cloud Condensate
    =
    = This sets the maximum value of the critical cloud condensate profile.
    = This is related to the option settings for
    = namelist:run_convection=ccw_for_precip_opt .
    = This will always be the maximum value for option 4.
    = mparwtr will always be used in options 0-3 but because of the
    = critical cloud depths (option 0) or other scalings (options 1-3)
    = it will not always directly equate to the maximum value of the
    = critical cloud condensate.
ns=namelist/unused
range=1e-5:1e-2
sort-key=5d-up-ccw-02
type=real

[namelist:run_convection=n_conv_calls]
compulsory=true
description=Number of convection sub-steps per model physics timestep
help=Ideally the convection scheme should not be sub-stepped.
    = Unfortunately with longer time steps and the CAPE closure the
    = mass flux will tend to exceed the CFL criterion so needs to be
    = sub-stepped. In general 2 convection sub-steps are required.
    = Attempts to use more than 4 will cause the model to stop.
ns=namelist/unused
range=1:4
sort-key=5a-05
type=integer

[namelist:run_convection=phi_ccp]
compulsory=true
description=Cold-pool convective triggering coefficient.
help=Relates the convective triggering to cold-pool properties.
ns=namelist/unused
range=0:1
sort-key=5i-cold_pools-05
type=real

[namelist:run_convection=plume_water_load]
compulsory=true
description=Water loading for undilute plume in diagnosis (5A and 6A)
help=Water loading options for convective diagnosis 5A and 6A schemes.
    = Same set of values available for both undilute and dilute plumes
    =
    = 0 - water loading kept for whole of parcel ascent - default option
    =
    = 1 - if water loading exceeds 1g/kg it is removed from the plume.
    =
    = 2 - if water loading exceeds a profile based on qsat it is removed from the plume.
ns=namelist/unused
sort-key=5b-04
values=0,1,2

[namelist:run_convection=pr_melt_frz_opt]
compulsory=true
description=Controls the treatment of phase changes in convective precipitation (5A and 6A)
help=Options for the treatment of phase changes in convective precipitation (5A and 6A)
    = 0 - Rain instantly freezes if T<0C and snow instantly melts if T>0C
    = 1 - Allows mixed phase precipitation.
    =     No freezing of rain. At T>0C Snow is melted at a rate that
    =     depends on the temperature and t_melt_snow.
    = 2 - Allows mixed phase precipitation.
    =     At T<0C rain is frozen at a rate that depends on the
    =     temperature and t_frez_rain (hardwired).
    =     At T>0C Snow is melted at a rate that depends on the
    =     temperature and t_melt_snow as for option 1.
    = Options 1 and 2 require t_melt_snow to be set.
ns=namelist/unused
sort-key=5g-dd-05
values=0,1,2

[namelist:run_convection=prog_ent_grad]
compulsory=true
description=Gradient used to calculate entrainment scaling from prognostic field
help=Gradient term used to calculate entrainment scaling from
    = 3d prognostic field based on surface precipitation. Usually negative
    = because a greater precipitation implies smaller entrainment rates.
    = 6a scheme only. Used under ent_opt_md,ent_opt_dp=6 or 7 and needs
    = l_conv_prog_precip=T.
ns=namelist/unused
range=-3.0:0.0
sort-key=5d-up-ent-10

[namelist:run_convection=prog_ent_int]
compulsory=true
description=Intercept used to calculate entrainment scaling from prognostic field
help=Intercept term used to calculate entrainment scaling from
    = 3d prognostic field based on surface precipitation.
    = 6a scheme only. Used under ent_opt_md,ent_opt_dp=6 or 7 and needs
    = l_conv_prog_precip=T.
ns=namelist/unused
range=-5.0:5.0
sort-key=5d-up-ent-11

[namelist:run_convection=prog_ent_max]
compulsory=true
description=Maximum scaling when calculating entrainment from prognostic field
help=Maximum scaling applied when calculating entrainment scaling from
    = 3d prognostic field based on surface precipitation.
    = 6a scheme only. Used under ent_opt_md,ent_opt_dp=6 or 7 and needs
    = l_conv_prog_precip=T.
ns=namelist/unused
range=0.0:5.0
sort-key=5d-up-ent-12

[namelist:run_convection=prog_ent_min]
compulsory=true
description=Minimum scaling when calculating entrainment from prognostic field
help=Minimum scaling applied when calculating entrainment scaling from
    = 3d prognostic field based on surface precipitation.
    = 6a scheme only. Used under ent_opt_md,ent_opt_dp=6 or 7 and needs
    = l_conv_prog_precip=T.
ns=namelist/unused
range=0.0:5.0
sort-key=5d-up-ent-13

[namelist:run_convection=qlmin]
compulsory=true
description=Minimum critical cloud condensate
help=Minimum Critical Cloud Condensate
    =
