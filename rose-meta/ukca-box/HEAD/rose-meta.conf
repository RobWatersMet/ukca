[namelist:run_ukca=i_ukca_photol]
compulsory=true
description=Photolysis scheme
help=Photolysis scheme options:
    =  No photolysis (0): No photolysis scheme will be run. UKCA will use
    =a zeroed array for photolysis rates.
    =
    =  Stratospheric photolysis only (1): if a stratospheric chemistry
    =scheme is selected, a stratospheric photolysis scheme will be used.
    =This scheme uses stratospheric photolysis rates based on the lookup
    =table approach of Lary and Pyle (1991).
    =
    =  2-D Photolysis (2): The 2-D photolysis scheme uses tropospheric
    =photolysis rates from a dataset developed using the Cambridge 2-D
    =model (Law and Pyle 1993). With stratospheric chemistry active,
    =stratospheric photolysis rates are calculated also and the final
    =photolysis rates used in UKCA are a linear combination of these.
    =
    =  Fast-JX (3): The Fast-JX scheme (Neu et al 2007) calculates photolysis
    =rates in the presence of an arbitrary mix of cloud and aerosol
    =layers. It uses up to 18-bins making it suitable for use in
    =stratospheric configurations. With stratospheric chemistry active,
    =stratospheric photolysis rates are calculated also and the final
    =photolysis rates used in UKCA are the sum of these.
    =To consider the impact of aerosols on the photolysis rates Fast-JX
    =currently makes use of SO4 aerosols from CLASSIC to calculate the
    =surface area so it is essential that the CLASSIC sulphate aerosol
    =scheme is switched ON when Fast-JX is used.
ns=namelist/UKCA Box-Model Science Settings/Chemistry/Photolysis
sort-key=p10001
trigger=namelist:run_ukca=fastjx_mode: 3 ;
       =namelist:run_ukca=fastjx_numwl: 3 ;
       =namelist:run_ukca=fastjx_prescutoff: 3 ;
       =namelist:run_ukca=i_ukca_solcyc: 3;
       =namelist:run_ukca=jvscat_file: 3 ;
       =namelist:run_ukca=jvspec_dir: 3 ;
       =namelist:run_ukca=jvspec_file: 3 ;
       =namelist:run_ukca=phot2d_dir: 2 ;
       =namelist:run_ukca=l_environ_jo2: 3 ;
       =namelist:run_ukca=l_environ_jo2b: 3 ;
value-titles=No photolysis,Stratospheric photolysis only,2-D Photolysis,Fast-JX
values=0,1,2,3

